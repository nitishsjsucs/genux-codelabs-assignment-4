<!doctype html>
<html><head><style>
body{margin:0;font:13px system-ui,sans-serif;color:#1f2937;background:#fffdf7;display:flex;gap:14px;align-items:center;padding:10px}
.side{display:flex;flex-direction:column;gap:6px;max-width:190px}
.k{font-size:11px;color:#6b7280}.v{font-size:17px;font-weight:650}
button{border:0;border-radius:8px;padding:8px 10px;background:#0f766e;color:#fff;font-weight:600;cursor:pointer}
.ok{color:#047857;font-weight:600}
.lg span{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px}
</style></head><body>
<svg id="clock" width="250" height="250" viewBox="-125 -125 250 250" role="img" aria-label="24 hour energy clock"></svg>
<div class="side">
  <div><div class="k">Best EV window today</div><div class="v">10:30&ndash;15:00</div></div>
  <div><div class="k">Estimated cost</div><div class="v">$1.10 <small>(saves $14.02 vs peak)</small></div></div>
  <div class="lg"><span style="background:#f59e0b"></span>solar kW <span style="background:#ef4444;margin-left:8px"></span>home load</div>
  <div class="lg"><span style="background:#bbf7d0"></span>off-peak <span style="background:#fde68a;margin-left:8px"></span>mid <span style="background:#fecaca;margin-left:8px"></span>peak</div>
  <button id="go">Schedule 10:30&ndash;15:00</button>
  <div id="note" class="k">Click to ask VoltPilot to book it.</div>
</div>
<script>
const solar=[0,0,0,0,0,0,0.2,0.9,1.8,2.9,3.8,4.5,4.8,4.6,4.0,3.1,2.0,1.0,0.3,0,0,0,0,0];
const load=[0.4,0.35,0.3,0.3,0.3,0.4,0.9,1.4,1.1,0.8,0.7,0.7,0.9,0.7,0.7,0.9,1.3,2.1,2.6,2.4,1.9,1.4,0.9,0.6];
const band=h=>h<6?"#bbf7d0":h<16?"#fde68a":h<21?"#fecaca":"#fde68a";
const svg=document.getElementById("clock"),NS="http://www.w3.org/2000/svg";
const el=(t,a)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);svg.appendChild(e);return e};
const pt=(h,r)=>{const a=(h/24)*2*Math.PI-Math.PI/2;return[r*Math.cos(a),r*Math.sin(a)]};
const arc=(h0,h1,r0,r1)=>{const[a,b]=pt(h0,r1),[c,d]=pt(h1,r1),[e,f]=pt(h1,r0),[g,i]=pt(h0,r0);const L=(h1-h0)>12?1:0;
  return`M${a},${b}A${r1},${r1} 0 ${L} 1 ${c},${d}L${e},${f}A${r0},${r0} 0 ${L} 0 ${g},${i}Z`};
for(let h=0;h<24;h++){el("path",{d:arc(h,h+1,100,118),fill:band(h),stroke:"#fff"});
  const s=el("path",{d:arc(h+0.15,h+0.85,34,34+solar[h]*13),fill:"#f59e0b"});
  const t=document.createElementNS(NS,"title");t.textContent=h+":00  solar "+solar[h]+" kW, load "+load[h]+" kW";s.appendChild(t);}
el("path",{d:arc(10.5,15,96,122),fill:"none",stroke:"#0f766e","stroke-width":3});
el("polygon",{points:load.map((v,h)=>pt(h+0.5,34+v*13).join(",")).join(" "),fill:"none",stroke:"#ef4444","stroke-width":1.6});
for(const h of[0,6,12,18]){const[x,y]=pt(h,88);el("text",{x,y:y+4,"text-anchor":"middle","font-size":10,fill:"#6b7280"}).textContent=h+"h"}
el("text",{y:-4,"text-anchor":"middle","font-size":12,"font-weight":700}).textContent="Today";
el("text",{y:12,"text-anchor":"middle","font-size":10,fill:"#6b7280"}).textContent="33.9 kWh solar";
document.getElementById("go").addEventListener("click",()=>{
  window.voltpilot.action("schedule_ev_charge",{window:"10:30-15:00"});
  const n=document.getElementById("note");n.textContent="Requested - waiting for VoltPilot";n.className="ok";});
</script>
</body></html>
